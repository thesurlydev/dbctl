[package]
name = "dbctl"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "dbctl"
path = "src/lib.rs"

[[bin]]
name = "dbctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = "0.23"
webpki-roots = "1"
anyhow = "1"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1.0"
zip = "8.6"
indicatif = "0.18.3"
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1"
dialoguer = "0.12"
rand = "0.10"
rustyline = "18"
sysinfo = "0.39"
