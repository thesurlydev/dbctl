[package]
name = "dbctl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Install and run PostgreSQL versions and clusters without root, with verified downloads"
readme = "../../README.md"
keywords = ["postgresql", "postgres", "database", "cli", "version-manager"]
categories = ["command-line-utilities", "database"]

[lib]
name = "dbctl"
path = "src/lib.rs"

[[bin]]
name = "dbctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
anyhow = "1"
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
zip = "9"
indicatif = "0.18.3"
dirs = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1"
dialoguer = "0.12"
rand = "0.10"
rustyline = "18"
sysinfo = "0.39"
sha2 = "0.11"
