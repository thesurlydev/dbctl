# Cargo.toml
[package]
name = "dbctl"
version = "0.1.0"
edition = "2024"
authors = ["Shane Witbeck <shane@surly.dev>"]
license = "Apache-2.0"

[[bin]]
name = "dbctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
anyhow = "1"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tar = "0.4"
flate2 = "1.0"
zip = "6.0"
indicatif = "0.18.3"
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.0"
dialoguer = "0.12"
rand = "0.9"
sysinfo = "0.37"
