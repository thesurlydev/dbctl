[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Shane Witbeck <shane@surly.dev>"]

[workspace.dependencies]
dbctl = { path = "crates/dbctl" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
