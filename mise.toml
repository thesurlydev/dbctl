[tasks.dev]
description = "Build the project in debug mode"
run = "cargo build"

[tasks.test]
description = "Run the fast tests (no PostgreSQL needed)"
run = "cargo test"

[tasks.test-integration]
description = "Run the CLI tests that install PostgreSQL and build pgvector (slow)"
run = "cargo test --test cli -- --ignored"

# `gate` is the name every repo uses for its full pre-commit check; `check`
# stays as an alias.
[tasks.gate]
description = "Build, test, lint (warnings are errors), and check formatting"
alias = "check"
run = [
  "cargo build",
  "cargo test",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.install]
description = "Install dbctl to ~/.cargo/bin"
run = "cargo install --path crates/dbctl"
